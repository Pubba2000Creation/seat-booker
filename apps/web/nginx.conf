server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames are content-addressed, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router owns the URL space: any path that is not a real file must return
  # index.html so a deep link like /workshops/42 is routed client-side instead of
  # 404ing at nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html itself must never be cached, or a redeploy keeps serving the old
  # asset references.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
